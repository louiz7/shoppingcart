[INCLUDES]
before = common.conf

[Definition]
# A normal SIP Digest exchange starts with an unauthenticated INVITE and an
# Asterisk "Failed to authenticate" notice before the authenticated retry.
# Matching that notice would eventually ban LiveKit itself. Only count the
# final endpoint-identification failure after Asterisk exhausted its retries.
_daemon = asterisk
__pid_re = (?:\s*\[\d+\])
log_prefix = (?:NOTICE|SECURITY|WARNING)%(__pid_re)s:?(?:\[C-[\da-f]*\])?:? [^:]+:\d*(?:(?: in)? [^:]+:)?
prefregex = ^%(__prefix_line)s%(log_prefix)s <F-CONTENT>.+</F-CONTENT>$
failregex = ^Request (?:'[^']*' )?from '(?:[^']*|.*?)' failed for '<HOST>(?::\d+)?'\s\(callid: [^\)]*\) - No matching endpoint found after 5 tries.*$
ignoreregex =
datepattern = {^LN-BEG}
