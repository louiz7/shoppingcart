upstream deliahapi { server 127.0.0.1:3002; }

server {
    listen 80;
    server_name api.deliah.ai;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.deliah.ai;

    ssl_certificate     /etc/letsencrypt/live/api.deliah.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.deliah.ai/privkey.pem;

    client_max_body_size 50M;

    # Explicit Rescova API routes. Unknown /v1 paths return 404 in the app.
    location /v1/ {
        proxy_pass http://deliahapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webhooks (Deepslate + LiveKit).
    location /webhooks/ {
        proxy_pass http://deliahapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dashboard + static legacy usage UI.
    location / {
        proxy_pass http://deliahapi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
